version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: verdict-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: verdict_user
      POSTGRES_PASSWORD: local_secret
      POSTGRES_DB: verdict_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: verdict-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: verdict-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.api
    container_name: verdict-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
    env_file:
      - ./apps/backend/.env
    environment:
      - NODE_ENV=production

  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.workers
    container_name: verdict-worker
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - ./apps/backend/.env
    environment:
      - NODE_ENV=production

volumes:
  postgres_data:
  redis_data:
  minio_data:
