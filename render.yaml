services:
  # ─────────────────────────────────────────
  # API + WebSocket server (web service)
  # ─────────────────────────────────────────
  - type: web
    name: verdict
    runtime: docker
    dockerfilePath: apps/backend/Dockerfile.api
    dockerContext: apps/backend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: HTTP_PORT
        value: 4000
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: PYTHON_BIN
        value: python3
      - key: DATABASE_URL
        sync: false
      - key: POOL_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: R2_ENDPOINT
        sync: false
      - key: BUCKET_NAME
        sync: false
      - key: ACCESSKEYID
        sync: false
      - key: SECRETACCESSKEY
        sync: false
      - key: PUBLIC_ENDPOINT
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
